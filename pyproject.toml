[project]
name = "replyo"
version = "0.1.0"
description = "AI automation assistant for a small business (dental clinic) — triage, qualify, answer, book, sync, escalate, follow up."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LangGraph core + Postgres checkpointer (cross-session memory)
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2",
    # LLM (OpenAI)
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.50",
    # API + channel
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-telegram-bot>=21.6",
    # Config
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
]

[project.optional-dependencies]
# Optional tracing — only needed if you set LANGSMITH_TRACING=true
trace = ["langsmith>=0.1.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
